<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konu Kartları</title>
    <script>
      // Tema sayfa çizilmeden seçilsin ki açılışta renk sıçraması olmasın (kural src/tema.js ile aynı).
      try {
        var tema = localStorage.getItem('konu_kartlari_tema');
        if (tema !== 'acik' && tema !== 'koyu') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'koyu' : 'acik';
        document.documentElement.dataset.tema = tema;
      } catch (e) {
        document.documentElement.dataset.tema = 'acik';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
